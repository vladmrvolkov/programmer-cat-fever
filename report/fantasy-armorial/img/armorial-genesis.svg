<rect x="210" y="40" width="236" height="84" fill="#E3C5E8" stroke="#333" stroke-width="1"/>
<text x="328.0" y="65.6" font-size="11" text-anchor="middle" fill="#111">conversation with Gemini on Sapkowski,</text>
<text x="328.0" y="79.2" font-size="11" text-anchor="middle" fill="#111">Lem and Tolkien&#x27;s sources; objections:</text>
<text x="328.0" y="92.8" font-size="11" text-anchor="middle" fill="#111">languages and myth directly, the</text>
<text x="328.0" y="106.4" font-size="11" text-anchor="middle" fill="#111">Ivanhoe parallels</text>
<rect x="466" y="40" width="236" height="84" fill="#FFDBA7" stroke="#333" stroke-width="1"/>
<text x="584.0" y="79.2" font-size="11" text-anchor="middle" fill="#111">network: 39 nodes, 83 links, era bands</text>
<text x="584.0" y="92.8" font-size="11" text-anchor="middle" fill="#111">(drawio)</text>
<rect x="722" y="40" width="236" height="84" fill="#82C3C0" stroke="#333" stroke-width="1"/>
<text x="840.0" y="79.2" font-size="11" text-anchor="middle" fill="#111">tree: 40 nodes, 39 tree links and 52</text>
<text x="840.0" y="92.8" font-size="11" text-anchor="middle" fill="#111">cross links (drawio)</text>
<rect x="978" y="40" width="236" height="84" fill="#E3C5E8" stroke="#333" stroke-width="1"/>
<text x="1096.0" y="79.2" font-size="11" text-anchor="middle" fill="#111">the arms of Francis Bacon as a model</text>
<text x="1096.0" y="92.8" font-size="11" text-anchor="middle" fill="#111">of quartering</text>
<rect x="466" y="150" width="236" height="84" fill="#82C3C0" stroke="#333" stroke-width="1"/>
<text x="584.0" y="175.6" font-size="11" text-anchor="middle" fill="#111">Claude as director: A, a pedigree with</text>
<text x="584.0" y="189.2" font-size="11" text-anchor="middle" fill="#111">inbreeding; B, an armorial, “rebellion</text>
<text x="584.0" y="202.8" font-size="11" text-anchor="middle" fill="#111">is also an inheritance”; C, an arch of</text>
<text x="584.0" y="216.4" font-size="11" text-anchor="middle" fill="#111">spolia</text>
<rect x="722" y="150" width="236" height="84" fill="#82ADE1" stroke="#333" stroke-width="1"/>
<text x="840.0" y="189.2" font-size="11" text-anchor="middle" fill="#111">Codex (v7-ext): a spanning tree;</text>
<text x="840.0" y="202.8" font-size="11" text-anchor="middle" fill="#111">grafted tree, river delta, proof sheet</text>
<rect x="978" y="150" width="236" height="84" fill="#82ADE1" stroke="#333" stroke-width="1"/>
<text x="1096.0" y="182.4" font-size="11" text-anchor="middle" fill="#111">the first armorial, built by code: 39</text>
<text x="1096.0" y="196.0" font-size="11" text-anchor="middle" fill="#111">shields, each quartering the whole</text>
<text x="1096.0" y="209.6" font-size="11" text-anchor="middle" fill="#111">shields of its sources</text>
<rect x="210" y="260" width="236" height="84" fill="#FFDBA7" stroke="#333" stroke-width="1"/>
<text x="328.0" y="299.2" font-size="11" text-anchor="middle" fill="#111">a classic tree; a heraldic tree after</text>
<text x="328.0" y="312.8" font-size="11" text-anchor="middle" fill="#111">variant B</text>
<rect x="466" y="260" width="236" height="84" fill="#82ADE1" stroke="#333" stroke-width="1"/>
<text x="584.0" y="299.2" font-size="11" text-anchor="middle" fill="#111">an arch of spolia after Piranesi; a</text>
<text x="584.0" y="312.8" font-size="11" text-anchor="middle" fill="#111">heraldic tree of six shields</text>
<rect x="978" y="260" width="236" height="84" fill="#E6E6E6" stroke="#333" stroke-width="1"/>
<text x="1096.0" y="285.6" font-size="11" text-anchor="middle" fill="#111">test 100: the hierarchy is followed,</text>
<text x="1096.0" y="299.2" font-size="11" text-anchor="middle" fill="#111">creativity 8–9; canting arms and a</text>
<text x="1096.0" y="312.8" font-size="11" text-anchor="middle" fill="#111">crest proposed; a wolf&#x27;s head for</text>
<text x="1096.0" y="326.4" font-size="11" text-anchor="middle" fill="#111">Sapkowski</text>
<rect x="210" y="400" width="236" height="84" fill="#82C3C0" stroke="#333" stroke-width="1"/>
<text x="328.0" y="432.4" font-size="11" text-anchor="middle" fill="#111">similar signs only where there is a</text>
<text x="328.0" y="446.0" font-size="11" text-anchor="middle" fill="#111">link; the shield is simple, the crest</text>
<text x="328.0" y="459.6" font-size="11" text-anchor="middle" fill="#111">may be complex</text>
<rect x="466" y="400" width="236" height="84" fill="#82ADE1" stroke="#333" stroke-width="1"/>
<text x="584.0" y="439.2" font-size="11" text-anchor="middle" fill="#111">39 emblems, one per node; the best:</text>
<text x="584.0" y="452.8" font-size="11" text-anchor="middle" fill="#111">the uprooted oak of Ivanhoe</text>
<rect x="722" y="400" width="236" height="84" fill="#82ADE1" stroke="#333" stroke-width="1"/>
<text x="840.0" y="425.6" font-size="11" text-anchor="middle" fill="#111">v2, Tolkien and Sapkowski: the</text>
<text x="840.0" y="439.2" font-size="11" text-anchor="middle" fill="#111">writer&#x27;s device above the shield,</text>
<text x="840.0" y="452.8" font-size="11" text-anchor="middle" fill="#111">direct sources only, affinities in</text>
<text x="840.0" y="466.4" font-size="11" text-anchor="middle" fill="#111">words</text>
<rect x="210" y="530" width="236" height="108" fill="#E3C5E8" stroke="#333" stroke-width="1"/>
<text x="328.0" y="560.8" font-size="11" text-anchor="middle" fill="#111">decisions: the load of v2; three</text>
<text x="328.0" y="574.4" font-size="11" text-anchor="middle" fill="#111">ranks; works apart from writers; fixed</text>
<text x="328.0" y="588.0" font-size="11" text-anchor="middle" fill="#111">devices — ring, wolf turned away,</text>
<text x="328.0" y="601.6" font-size="11" text-anchor="middle" fill="#111">lion, uprooted oak, St George&#x27;s cross,</text>
<text x="328.0" y="615.2" font-size="11" text-anchor="middle" fill="#111">hedonist robot; add the Strugatskys</text>
<rect x="466" y="530" width="236" height="84" fill="#82C3C0" stroke="#333" stroke-width="1"/>
<text x="584.0" y="569.2" font-size="11" text-anchor="middle" fill="#111">brief v3: shield, badge and seal; nine</text>
<text x="584.0" y="582.8" font-size="11" text-anchor="middle" fill="#111">rules; the sources of 41 nodes</text>
<rect x="722" y="530" width="236" height="84" fill="#82C3C0" stroke="#333" stroke-width="1"/>
<text x="840.0" y="562.4" font-size="11" text-anchor="middle" fill="#111">a Claude director (menippean prompt):</text>
<text x="840.0" y="576.0" font-size="11" text-anchor="middle" fill="#111">a catalogue of 41 and sketches drawn</text>
<text x="840.0" y="589.6" font-size="11" text-anchor="middle" fill="#111">by code</text>
<rect x="978" y="530" width="236" height="84" fill="#FFDBA7" stroke="#333" stroke-width="1"/>
<text x="1096.0" y="555.6" font-size="11" text-anchor="middle" fill="#111">a Gemini director (menippean prompt):</text>
<text x="1096.0" y="569.2" font-size="11" text-anchor="middle" fill="#111">a catalogue of 41 and two sheets; the</text>
<text x="1096.0" y="582.8" font-size="11" text-anchor="middle" fill="#111">generator copies a torse from the</text>
<text x="1096.0" y="596.4" font-size="11" text-anchor="middle" fill="#111">sample</text>
<rect x="466" y="660" width="236" height="84" fill="#82C3C0" stroke="#333" stroke-width="1"/>
<text x="584.0" y="699.2" font-size="11" text-anchor="middle" fill="#111">a menippean prompt for heraldry:</text>
<text x="584.0" y="712.8" font-size="11" text-anchor="middle" fill="#111">outsiders, six moves, dice by letters</text>
<rect x="722" y="660" width="236" height="84" fill="#82C3C0" stroke="#333" stroke-width="1"/>
<text x="840.0" y="692.4" font-size="11" text-anchor="middle" fill="#111">v4: one catalogue merged from the</text>
<text x="840.0" y="706.0" font-size="11" text-anchor="middle" fill="#111">runs; the shields computed by script;</text>
<text x="840.0" y="719.6" font-size="11" text-anchor="middle" fill="#111">two short tasks</text>
<rect x="466" y="790" width="236" height="84" fill="#82ADE1" stroke="#333" stroke-width="1"/>
<text x="584.0" y="815.6" font-size="11" text-anchor="middle" fill="#111">ChatGPT under it: Howard&#x27;s helmet,</text>
<text x="584.0" y="829.2" font-size="11" text-anchor="middle" fill="#111">Martin&#x27;s obsidian flame, Vance&#x27;s</text>
<text x="584.0" y="842.8" font-size="11" text-anchor="middle" fill="#111">hatted sun, Eddison&#x27;s signet, Cook&#x27;s</text>
<text x="584.0" y="856.4" font-size="11" text-anchor="middle" fill="#111">needle; sheets for Le Guin and Gaiman</text>
<rect x="210" y="790" width="236" height="84" fill="#E3C5E8" stroke="#333" stroke-width="1"/>
<text x="328.0" y="822.4" font-size="11" text-anchor="middle" fill="#111">plan: devices as separate tiles,</text>
<text x="328.0" y="836.0" font-size="11" text-anchor="middle" fill="#111">shields assembled by code, an HTML</text>
<text x="328.0" y="849.6" font-size="11" text-anchor="middle" fill="#111">page over a painted tree</text>
<rect x="722" y="790" width="236" height="84" fill="#82C3C0" stroke="#333" stroke-width="1"/>
<text x="840.0" y="829.2" font-size="11" text-anchor="middle" fill="#111">9 tiles cut from earlier sheets, 2</text>
<text x="840.0" y="842.8" font-size="11" text-anchor="middle" fill="#111">recoloured; prompts in three parts</text>
<rect x="978" y="790" width="236" height="84" fill="#F4AD87" stroke="#333" stroke-width="1"/>
<text x="1096.0" y="836.0" font-size="11" text-anchor="middle" fill="#111">the painted tree; the paper</text>
<rect x="210" y="920" width="236" height="84" fill="#82C3C0" stroke="#333" stroke-width="1"/>
<text x="328.0" y="952.4" font-size="11" text-anchor="middle" fill="#111">the page: data, shields assembled from</text>
<text x="328.0" y="966.0" font-size="11" text-anchor="middle" fill="#111">tiles, windows with text, links both</text>
<text x="328.0" y="979.6" font-size="11" text-anchor="middle" fill="#111">ways</text>
<rect x="722" y="920" width="236" height="84" fill="#F4AD87" stroke="#333" stroke-width="1"/>
<text x="840.0" y="959.2" font-size="11" text-anchor="middle" fill="#111">33 tiles in three batches; 4 redone:</text>
<text x="840.0" y="972.8" font-size="11" text-anchor="middle" fill="#111">Anderson, Wagner, Zelazny, the robot</text>
<rect x="466" y="1050" width="236" height="70" fill="#C9E3B0" stroke="#333" stroke-width="1"/>
<text x="584.0" y="1082.2" font-size="11" text-anchor="middle" fill="#111">The Fantasy Armorial Tree: 41 coats of</text>
<text x="584.0" y="1095.8" font-size="11" text-anchor="middle" fill="#111">arms on the painted tree</text>
<rect x="210" y="1180" width="136" height="34" fill="#E3C5E8" stroke="#333"/>
<text x="278" y="1194" font-size="10" text-anchor="middle" fill="#111">the researcher</text>
<rect x="356" y="1180" width="136" height="34" fill="#82C3C0" stroke="#333"/>
<text x="424" y="1194" font-size="10" text-anchor="middle" fill="#111">Claude</text>
<rect x="502" y="1180" width="136" height="34" fill="#82ADE1" stroke="#333"/>
<text x="570" y="1194" font-size="10" text-anchor="middle" fill="#111">ChatGPT (in Codex or</text>
<text x="570" y="1206" font-size="10" text-anchor="middle" fill="#111">chat)</text>
<rect x="648" y="1180" width="136" height="34" fill="#FFDBA7" stroke="#333"/>
<text x="716" y="1194" font-size="10" text-anchor="middle" fill="#111">Gemini</text>
<rect x="794" y="1180" width="136" height="34" fill="#F4AD87" stroke="#333"/>
<text x="862" y="1194" font-size="10" text-anchor="middle" fill="#111">image generators</text>
<rect x="940" y="1180" width="136" height="34" fill="#E6E6E6" stroke="#333"/>
<text x="1008" y="1194" font-size="10" text-anchor="middle" fill="#111">AI readers (a test)</text>
<rect x="1086" y="1180" width="136" height="34" fill="#C9E3B0" stroke="#333"/>
<text x="1154" y="1194" font-size="10" text-anchor="middle" fill="#111">the result</text>
<text x="20" y="1192" font-size="10" fill="#222">solid arrow: led to; dashed: the</text>
<text x="20" y="1204" font-size="10" fill="#222">same maker or a looser link</text>
