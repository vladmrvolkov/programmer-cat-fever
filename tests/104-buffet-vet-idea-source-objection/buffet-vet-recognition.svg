<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1400" height="880" fill="#F2F2F2"/>
<text x="20" y="34" font-size="18" font-weight="bold" fill="#111">Does the reader recall the source joke?</text>
<text x="20" y="58" font-size="12" fill="#222">test 104, 24 November 2026: four AI readers (Claude Opus 5.5, Gemini Neon High, ChatGPT GPT 6.2, DeepSeek) answer four questions about the “buffet | vet” sheet</text>
<text x="260" y="93" font-size="12" fill="#222"><tspan font-weight="bold">Versions close to the joke</tspan> (tests since 2 September)</text>
<text x="260" y="313" font-size="12" fill="#222"><tspan font-weight="bold">The “buffet | vet” sheet</tspan></text>
<text x="540" y="313" font-size="12" fill="#222"><tspan font-weight="bold">Questions 1–2</tspan>: the sheet alone</text>
<text x="830" y="313" font-size="12" fill="#222"><tspan font-weight="bold">Question 3</tspan>: the joke is shown</text>
<text x="1120" y="313" font-size="12" fill="#222"><tspan font-weight="bold">Question 4</tspan>: the researcher&#x27;s argument</text>
<line x1="220.0" y1="252.3" x2="293.3" y2="210.0" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="220.0" y1="342.7" x2="260.0" y2="355.8" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="500.0" y1="160.0" x2="540.0" y2="160.0" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="920.0" y1="160.0" x2="960.0" y2="160.0" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<line x1="380.0" y1="460.0" x2="380.0" y2="490.0" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="500.0" y1="503.3" x2="540.0" y2="486.0" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="800.0" y1="430.0" x2="830.0" y2="430.0" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="1090.0" y1="407.6" x2="1120.0" y2="402.4" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="1250.0" y1="430.0" x2="1250.0" y2="450.0" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="960.0" y1="530.0" x2="960.0" y2="560.0" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<polyline points="815,210 815,615 830,615" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="20" y="250" width="200" height="120" fill="#FFFFFF" stroke="#333" stroke-width="1"/>
<text x="120.0" y="286.8" font-size="11" text-anchor="middle" fill="#111">the joke: a talking cat is</text>
<text x="120.0" y="300.4" font-size="11" text-anchor="middle" fill="#111">offered a job in a circus.</text>
<text x="120.0" y="314.0" font-size="11" text-anchor="middle" fill="#111">“…Sounds tempting. But what</text>
<text x="120.0" y="327.6" font-size="11" text-anchor="middle" fill="#111">would they need a programmer</text>
<text x="120.0" y="341.2" font-size="11" text-anchor="middle" fill="#111">for?”</text>
<rect x="260" y="110" width="240" height="100" fill="#F4AD87" stroke="#333" stroke-width="1"/>
<text x="380.0" y="150.4" font-size="11" text-anchor="middle" fill="#111">pictures that keep the joke&#x27;s lines,</text>
<text x="380.0" y="164.0" font-size="11" text-anchor="middle" fill="#111">the key one word for word: “what would</text>
<text x="380.0" y="177.6" font-size="11" text-anchor="middle" fill="#111">they need a programmer for?”</text>
<rect x="540" y="110" width="380" height="100" fill="#E6E6E6" stroke="#333" stroke-width="1"/>
<text x="730.0" y="136.8" font-size="11" text-anchor="middle" fill="#111">readers recall the joke and its ancestry: a talking dog who</text>
<text x="730.0" y="150.4" font-size="11" text-anchor="middle" fill="#111">turns out to be a plumber or a bricklayer (Claude and Gemini,</text>
<text x="730.0" y="164.0" font-size="11" text-anchor="middle" fill="#111">from 2 September; 4 of Claude&#x27;s 8 answers on the cat). The</text>
<text x="730.0" y="177.6" font-size="11" text-anchor="middle" fill="#111">Annunciation version (case 19): the lines are in the picture,</text>
<text x="730.0" y="191.2" font-size="11" text-anchor="middle" fill="#111">the joke reaches all four</text>
<rect x="960" y="110" width="420" height="100" fill="#FFFFFF" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/>
<text x="1170.0" y="157.2" font-size="11" text-anchor="middle" fill="#111" font-style="italic">recognition comes from the words, not the drawing: the red-ink joke</text>
<text x="1170.0" y="170.8" font-size="11" text-anchor="middle" fill="#111" font-style="italic">was found by its verbatim line “NO RED INK” (case 15)</text>
<rect x="260" y="330" width="240" height="130" fill="#FFDBA7" stroke="#333" stroke-width="1"/>
<text x="380.0" y="371.8" font-size="11" text-anchor="middle" fill="#111">menippean director (Gemini, candidate</text>
<text x="380.0" y="385.4" font-size="11" text-anchor="middle" fill="#111">3): the vet; the key line is replaced:</text>
<text x="380.0" y="399.0" font-size="11" text-anchor="middle" fill="#111">“who&#x27;s going to maintain their</text>
<text x="380.0" y="412.6" font-size="11" text-anchor="middle" fill="#111">ticketing database while I jump</text>
<text x="380.0" y="426.2" font-size="11" text-anchor="middle" fill="#111">through hoops?”</text>
<rect x="260" y="490" width="240" height="130" fill="#F4AD87" stroke="#333" stroke-width="1"/>
<text x="380.0" y="531.8" font-size="11" text-anchor="middle" fill="#111">the sheet after an edit: “buffet |</text>
<text x="380.0" y="545.4" font-size="11" text-anchor="middle" fill="#111">vet”, 7.0 kg on the scale, a laptop in</text>
<text x="380.0" y="559.0" font-size="11" text-anchor="middle" fill="#111">the briefcase; in the last panel the</text>
<text x="380.0" y="572.6" font-size="11" text-anchor="middle" fill="#111">vet hands over the napoleon, with a</text>
<text x="380.0" y="586.2" font-size="11" text-anchor="middle" fill="#111">new last line</text>
<rect x="540" y="330" width="260" height="200" fill="#E6E6E6" stroke="#333" stroke-width="1"/>
<text x="670.0" y="386.4" font-size="11" text-anchor="middle" fill="#111">They read the new joke: diet, burnout, a</text>
<text x="670.0" y="400.0" font-size="11" text-anchor="middle" fill="#111">vet who says “strict kibble” and hands</text>
<text x="670.0" y="413.6" font-size="11" text-anchor="middle" fill="#111">over the cake. Nobody faults the ending:</text>
<text x="670.0" y="427.2" font-size="11" text-anchor="middle" fill="#111">“It still lands as a punchline” (Claude).</text>
<text x="670.0" y="440.8" font-size="11" text-anchor="middle" fill="#111">The source: only Claude names the</text>
<text x="670.0" y="454.4" font-size="11" text-anchor="middle" fill="#111">template; Gemini asks whether it is a</text>
<text x="670.0" y="468.0" font-size="11" text-anchor="middle" fill="#111">meme, ChatGPT guesses a conversation,</text>
<text x="670.0" y="481.6" font-size="11" text-anchor="middle" fill="#111">DeepSeek the idiom “fat cat”.</text>
<rect x="830" y="330" width="260" height="200" fill="#E6E6E6" stroke="#333" stroke-width="1"/>
<text x="960.0" y="393.2" font-size="11" text-anchor="middle" fill="#111">Three of four judge by the joke. Claude:</text>
<text x="960.0" y="406.8" font-size="11" text-anchor="middle" fill="#111">the cat&#x27;s blind spot is lost; the laptop,</text>
<text x="960.0" y="420.4" font-size="11" text-anchor="middle" fill="#111">“corporate tab” and 23:55 give the</text>
<text x="960.0" y="434.0" font-size="11" text-anchor="middle" fill="#111">programmer away. ChatGPT: the joke is</text>
<text x="960.0" y="447.6" font-size="11" text-anchor="middle" fill="#111">stronger, the world richer; the laptop</text>
<text x="960.0" y="461.2" font-size="11" text-anchor="middle" fill="#111">sacrifices the reveal. Gemini: the AI</text>
<text x="960.0" y="474.8" font-size="11" text-anchor="middle" fill="#111">mutated the mechanics. DeepSeek praises.</text>
<rect x="830" y="560" width="260" height="110" fill="#FFFFFF" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/>
<text x="960.0" y="598.6" font-size="11" text-anchor="middle" fill="#111" font-style="italic">Not concluded: a well-known joke has no</text>
<text x="960.0" y="612.2" font-size="11" text-anchor="middle" fill="#111" font-style="italic">surprise to protect, although Claude</text>
<text x="960.0" y="625.8" font-size="11" text-anchor="middle" fill="#111" font-style="italic">called it “an old joke” (question 1) and</text>
<text x="960.0" y="639.4" font-size="11" text-anchor="middle" fill="#111" font-style="italic">Gemini “a beloved variation” (question 3).</text>
<rect x="1120" y="330" width="260" height="100" fill="#E3C5E8" stroke="#333" stroke-width="1"/>
<text x="1250.0" y="356.8" font-size="11" text-anchor="middle" fill="#111">“…the original joke is well-known… it’s</text>
<text x="1250.0" y="370.4" font-size="11" text-anchor="middle" fill="#111">difficult to hide spoilers in a single</text>
<text x="1250.0" y="384.0" font-size="11" text-anchor="middle" fill="#111">image anyway. So, the laptop bag serves</text>
<text x="1250.0" y="397.6" font-size="11" text-anchor="middle" fill="#111">more as an additional anchor… rather than</text>
<text x="1250.0" y="411.2" font-size="11" text-anchor="middle" fill="#111">as a spoiler.”</text>
<rect x="1120" y="450" width="260" height="220" fill="#E6E6E6" stroke="#333" stroke-width="1"/>
<text x="1250.0" y="516.4" font-size="11" text-anchor="middle" fill="#111">All four agree. Claude also withdraws two</text>
<text x="1250.0" y="530.0" font-size="11" text-anchor="middle" fill="#111">points the argument did not touch: the</text>
<text x="1250.0" y="543.6" font-size="11" text-anchor="middle" fill="#111">last panel and the original line. ChatGPT</text>
<text x="1250.0" y="557.2" font-size="11" text-anchor="middle" fill="#111">states the design best: “a talking cat is</text>
<text x="1250.0" y="570.8" font-size="11" text-anchor="middle" fill="#111">apparently less remarkable than its</text>
<text x="1250.0" y="584.4" font-size="11" text-anchor="middle" fill="#111">unhealthy lifestyle”. DeepSeek: “how</text>
<text x="1250.0" y="598.0" font-size="11" text-anchor="middle" fill="#111">deliberate and smart the visual design of</text>
<text x="1250.0" y="611.6" font-size="11" text-anchor="middle" fill="#111">this comic is!”</text>
<rect x="260" y="700" width="1120" height="64" fill="#C9E3B0" stroke="#333" stroke-width="1"/>
<text x="820.0" y="729.2" font-size="11" text-anchor="middle" fill="#111">The models know the joke (top row). Without the source they judge the new joke; the source brings its own measure (question 3); that the laptop is no spoiler comes only with the</text>
<text x="820.0" y="742.8" font-size="11" text-anchor="middle" fill="#111">researcher&#x27;s words (question 4).</text>
<rect x="260" y="810" width="150" height="36" fill="#FFFFFF" stroke="#333"/>
<text x="335" y="832" font-size="10" text-anchor="middle" fill="#111">the source joke</text>
<rect x="420" y="810" width="150" height="36" fill="#E3C5E8" stroke="#333"/>
<text x="495" y="832" font-size="10" text-anchor="middle" fill="#111">the researcher</text>
<rect x="580" y="810" width="150" height="36" fill="#FFDBA7" stroke="#333"/>
<text x="655" y="832" font-size="10" text-anchor="middle" fill="#111">Gemini as director</text>
<rect x="740" y="810" width="150" height="36" fill="#F4AD87" stroke="#333"/>
<text x="815" y="826" font-size="10" text-anchor="middle" fill="#111">image generator, with the</text>
<text x="815" y="838" font-size="10" text-anchor="middle" fill="#111">researcher&#x27;s edits</text>
<rect x="900" y="810" width="150" height="36" fill="#E6E6E6" stroke="#333"/>
<text x="975" y="832" font-size="10" text-anchor="middle" fill="#111">AI readers</text>
<rect x="1060" y="810" width="150" height="36" fill="#C9E3B0" stroke="#333"/>
<text x="1135" y="832" font-size="10" text-anchor="middle" fill="#111">what follows</text>
<text x="20" y="822" font-size="10" fill="#222">solid arrow: led to; dashed arrow and</text>
<text x="20" y="834" font-size="10" fill="#222">dashed box: a remark that explains a</text>
<text x="20" y="846" font-size="10" fill="#222">step or names what was not used</text>
</svg>
